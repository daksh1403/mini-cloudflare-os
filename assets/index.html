<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Cloudflare OS</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #f6821f; --accent2: #fbad3c;
    --green: #2ecc71; --red: #e74c3c; --amber: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  header h1 { font-size: 22px; letter-spacing: 0.3px; }
  header h1 span { color: var(--accent); }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  select, button, input {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  button { cursor: pointer; transition: all 0.15s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: var(--accent2); }
  button.small { padding: 4px 8px; font-size: 12px; }
  button.green { color: var(--green); } button.red { color: var(--red); } button.amber { color: var(--amber); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 120px; }
  .gadget { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .gadget .name { font-weight: 600; font-size: 15px; }
  .gadget .meta { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
  .acl { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .chip.owner { border-color: var(--accent); color: var(--accent); }
  .chip.editor { border-color: var(--green); color: var(--green); }
  .chip.viewer { border-color: var(--amber); color: var(--amber); }
  .notes textarea { width: 100%; min-height: 120px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: 14px/1.5 ui-monospace, monospace; resize: vertical; }
  .entry { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding: 6px 0; display: flex; gap: 8px; align-items: baseline; }
  .entry .t { color: var(--text); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; max-width: 320px; }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mini <span>Cloudflare OS</span></h1>
    <span class="badge">Durable Objects · platform-enforced ACL · Gatekeeper approvals</span>
    <div class="who">
      <label for="who">Acting as</label>
      <select id="who">
        <option value="alice">alice (owner)</option>
        <option value="bob">bob (guest)</option>
        <option value="mallory">mallory (stranger)</option>
        <option value="">anonymous</option>
      </select>
    </div>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>Gadgets</h2>
      <div class="row">
        <input id="gid" placeholder="gadget id (e.g. notes1)" value="notes1">
        <input id="gname" placeholder="name (e.g. Study Notes)" value="Study Notes">
        <button class="primary" onclick="createGadget()">Create</button>
      </div>
      <div id="gadgets"></div>
    </section>

    <section class="panel">
      <h2>Selected gadget</h2>
      <div id="selected">Pick a gadget from the left to open it.</div>
    </section>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const API = "";
let current = null; // gadget meta
let notes = {};

function $(id) { return document.getElementById(id); }
function who() { return $("who").value; }
function headers(json) {
  const h = {};
  if (who() !== "") h["x-user-id"] = who();
  if (json) h["content-type"] = "application/json";
  return h;
}
async function api(method, path, body) {
  const res = await fetch(API + path, { method, headers: headers(body !== undefined), body: body !== undefined ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || res.statusText || "HTTP " + res.status);
  return data;
}
function toast(msg, ok) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast " + (ok ? "ok" : "err"); t.style.display = "block";
  clearTimeout(t._timer); t._timer = setTimeout(() => t.style.display = "none", 3500);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---- gadgets list ----
async function refresh() {
  const gid = $("gid").value.trim() || "notes1";
  try {
    const data = await api("GET", `/gadgets/${gid}/data`);
    notes = data.data || {};
  } catch (e) { notes = {}; }
  render();
}
function render() {
  const gid = $("gid").value.trim() || "notes1";
  const box = $("gadgets");
  const active = current && current.id === gid;
  box.innerHTML = `
    <div class="gadget" style="${active ? 'border-color: var(--accent)' : ''}">
      <div class="name">${esc(gid)} ${active ? "· open" : ""}</div>
      <div class="row">
        <button class="small primary" onclick="openGadget()">Open</button>
        <button class="small" onclick="createGadget()">Create/init</button>
      </div>
    </div>`;
  renderSelected(gid);
}
async function createGadget() {
  const gid = $("gid").value.trim();
  const name = $("gname").value.trim() || gid;
  if (!gid) return toast("gadget id required", false);
  try {
    await api("POST", `/gadgets/${gid}/init`, { name, app: "notes" });
    toast("gadget created", true); refresh();
  } catch (e) { toast(e.message, false); }
}
async function openGadget() {
  const gid = $("gid").value.trim();
  if (!gid) return toast("gadget id required", false);
  try {
    current = (await api("GET", `/gadgets/${gid}/meta`)).gadget;
    await refresh();
    toast("opened " + gid, true);
  } catch (e) { toast(e.message, false); }
}

// ---- selected gadget view ----
function renderSelected(gid) {
  const box = $("selected");
  if (!current || current.id !== gid) {
    box.innerHTML = `<div class="empty">Click <b>Open</b> on a gadget (as its owner) to load it.</div>`;
    return;
  }
  const acl = (current.acl || []).map(e =>
    `<span class="chip ${e.role}">${esc(e.user_id)} · ${esc(e.role)}</span>`).join("");
  box.innerHTML = `
    <div class="gadget">
      <div class="name">${esc(current.name)}</div>
      <div class="meta">app: ${esc(current.app)} · owner: ${esc(current.owner_id)} · id: ${esc(current.id)}</div>
      <div class="acl">${acl || '<span class="empty">no members</span>'}</div>
      <div class="row">
        <input id="share_user" placeholder="user to share with" value="bob">
        <select id="share_role"><option value="viewer">viewer</option><option value="editor">editor</option></select>
        <button class="small" onclick="shareGadget()">Share</button>
        <button class="small red" onclick="revokeGadget()">Revoke</button>
      </div>
      <div class="notes">
        <textarea id="note_editor" placeholder="type notes here...">${esc(JSON.stringify(notes, null, 2))}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="small primary" onclick="saveNotes()">Save notes</button>
          <button class="small" onclick="refreshNotes()">Reload</button>
        </div>
      </div>
    </div>
    <h2 style="margin-top:16px">Gatekeeper</h2>
    <div class="row">
      <input id="gk_action" placeholder="action (e.g. post)" value="post">
      <input id="gk_target" placeholder="target (e.g. twitter)" value="twitter">
      <input id="gk_payload" placeholder="payload" value="hello world">
      <button class="small primary" onclick="requestApproval()">Queue action</button>
    </div>
    <div id="approvals"></div>
    <h2 style="margin-top:16px">Audit log</h2>
    <div id="audit"></div>`;
  renderApprovals(); renderAudit();
}
async function shareGadget() {
  try {
    current = (await api("POST", `/gadgets/${current.id}/share`, { user_id: $("share_user").value, role: $("share_role").value })).gadget;
    toast("shared", true); render();
  } catch (e) { toast(e.message, false); }
}
async function revokeGadget() {
  const u = $("share_user").value;
  try {
    current = (await api("POST", `/gadgets/${current.id}/revoke`, { user_id: u })).gadget;
    toast("revoked " + u, true); render();
  } catch (e) { toast(e.message, false); }
}
async function saveNotes() {
  let parsed;
  try { parsed = JSON.parse($("note_editor").value); }
  catch (e) { return toast("notes must be valid JSON", false); }
  try {
    await api("POST", `/gadgets/${current.id}/data`, { values: parsed });
    toast("notes saved", true); refreshNotes();
  } catch (e) { toast(e.message, false); }
}
async function refreshNotes() {
  try {
    const data = await api("GET", `/gadgets/${current.id}/data`);
    notes = data.data || {};
    const ed = $("note_editor");
    if (ed) ed.value = JSON.stringify(notes, null, 2);
    renderApprovals(); renderAudit();
  } catch (e) { toast(e.message, false); }
}
async function requestApproval() {
  try {
    const a = await api("POST", `/gadgets/${current.id}/gatekeeper`,
      { action: $("gk_action").value, target: $("gk_target").value, payload: $("gk_payload").value });
    toast("action queued (pending)", true); renderApprovals();
  } catch (e) { toast(e.message, false); }
}
async function renderApprovals() {
  const box = $("approvals");
  if (!box) return;
  try {
    const list = (await api("GET", `/gadgets/${current.id}/approvals`)).approvals || [];
    box.innerHTML = list.length ? list.map(a => `
      <div class="entry">
        <span class="chip ${a.state}">${esc(a.state)}</span>
        <span class="t">${esc(a.action)} → ${esc(a.target)}</span>
        <span>by ${esc(a.requested_by)} · ${esc(a.payload)}</span>
        ${a.state === "pending" ? `
          <button class="small green" onclick="decide('${a.id}','approved')">Approve</button>
          <button class="small red" onclick="decide('${a.id}','rejected')">Reject</button>` : ""}
      </div>`).join("") : `<div class="empty">no gatekeeper actions</div>`;
  } catch (e) { box.innerHTML = `<div class="entry">${esc(e.message)}</div>`; }
}
async function decide(id, decision) {
  try {
    await api("POST", `/gadgets/${current.id}/approvals/decide`, { id, decision });
    toast("approval " + decision, true); renderApprovals(); renderAudit();
  } catch (e) { toast(e.message, false); }
}
async function renderAudit() {
  const box = $("audit");
  if (!box) return;
  try {
    const list = (await api("GET", `/gadgets/${current.id}/audit`)).audit || [];
    box.innerHTML = list.length ? list.slice().reverse().map(e => `
      <div class="entry"><span class="t">${esc(e.action)}</span> <span>${esc(e.detail)}</span>
      <span>by ${esc(e.actor)} · ${new Date(e.at).toLocaleTimeString()}</span></div>`).join("")
      : `<div class="empty">no audit entries</div>`;
  } catch (e) { box.innerHTML = `<div class="entry">${esc(e.message)}</div>`; }
}

$("who").addEventListener("change", refresh);
$("gid").addEventListener("change", refresh);
refresh();
</script>
</body>
</html>

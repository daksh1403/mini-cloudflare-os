# Mini Cloudflare OS — Python implementation.
# Stack follows the Daksh AI Engineer Academy tech stack:
#   FastAPI + pytest (TDD) + behave (BDD) + Docker + GitHub Actions (CI/CD).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-cloudflare-os"
version = "0.1.0"
description = "Mini Cloudflare OS — sandboxed per-user Gadgets, platform-enforced access control, Gatekeeper-style approvals. Built with TDD + BDD + CI/CD (Python stack)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "behave>=1.2.6,<2.0",
    "httpx>=0.27,<1.0",     # TestClient uses httpx
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]
# Cloudflare Workers runtime deps — only needed for the Workers deploy path
# (worker.py / durable_object.py). They are not imported by the local app,
# so the standard test gate does not require them.
workers = [
    "workers-py>=0.1",
    "workers-runtime-sdk>=0.1",
]

[tool.setuptools.packages.find]
include = ["cloudflare_os*"]

[tool.pytest.ini_options]
# TDD unit tests. Feature (BDD) tests are run by behave separately.
testpaths = ["tests/unit"]
addopts = "-q --cov=cloudflare_os --cov-report=term-missing"

[tool.coverage.run]
# Workers-runtime-only modules (import `workers`/`pyodide`; not importable by
# pytest). They are validated by `wrangler deploy`/`wrangler dev`, not unit
# tests, so exclude them from the coverage gate.
omit = [
    "cloudflare_os/worker.py",
    "cloudflare_os/durable_object.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# The Workers entrypoint + Durable Object import `workers`/`pyodide.ffi`,
# which only exist inside the Workers runtime. Exclude them from the local
# strict typecheck; CI deploys them via wrangler which validates them.
files = ["cloudflare_os", "tests"]
exclude = ["cloudflare_os/worker.py", "cloudflare_os/durable_object.py"]
